<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // Yeh script URL check karegi aur agar /claim-angel-number hoga toh wahan bhej degi
        var path = window.location.pathname;
        if (path.includes("claim-angel-number")) {
            window.location.replace("/index.html#claim-angel-number");
        } else {
            window.location.replace("/index.html");
        }
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
